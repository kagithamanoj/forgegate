[project]
name = "oxvara"
version = "0.2.0"
description = "Vendor-neutral governance for agent access to your API estate: Apigee, Azure APIM, Kong"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Manoj Kagitha" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100

[project.scripts]
oxvara = "oxvara.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
